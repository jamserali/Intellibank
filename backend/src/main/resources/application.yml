spring:
  application:
    name: intellibank-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:intellibank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
intellibank:
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-before-deploy-2026}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  demo-users:
    admin-password: ${DEMO_ADMIN_PASSWORD:Admin123!}
    banker-password: ${DEMO_BANKER_PASSWORD:Banker123!}
    analyst-password: ${DEMO_ANALYST_PASSWORD:Analyst123!}
    viewer-password: ${DEMO_VIEWER_PASSWORD:Viewer123!}
